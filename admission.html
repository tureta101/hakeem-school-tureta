    <div class="admission">
       <marquee class="adm"> <h1>ADMISSION FORM</h1></marquee>
        <P>Kindly fill the form below to apply for Admission in to Hakeem Nursery and Primary School Tureta.</P>
        </div>

<section class="admission">
        <form class="admission-form">
            <label for="name">Child's Full Name:</label>
            <input type="text" placeholder="Enter Child's Full Name" required>

            <label for="gender">Select Your Gender:</label>

             <label for="male">Male:</label>
            <input type="radio" name="gender" id="Male"  value="male">
           
             <label for="female">Female:</label>
             <input type="radio" name="gender" id="Female" value="female" required>

             <label for="resident">Resident Address:</label>
             <input type="text" placeholder="Enter Your Address" required>

             <label for="lga">Local Govt.:</label>
             <input type="text" placeholder="Enter Your Local govt." required>

             <label for="state">State:</label>
             <input type="text" placeholder="Enter Your State" required>


            <label for="name">Date of Birth:</label>
            <input type="date" placeholder="Date of Birth" required>
           
            <label for="">class Applying for:</label>
            <select required>
                <option value="">select class</option>
                <option value="">Nursery 1</option>
                <option value="">Nursery 2</option>
                <option value="">Nursery 3</option>
                <option value="">Primary 1</option>
                <option value="">Primary 2</option>
                <option value="">Primary 3</option>
                <option value="">Primary 4</option>
                <option value="">Primary 5</option>
                <option value="">Primary 6</option>
            </select>
            <label for="">Parent/Guardian Name:</label>
            <input type="text" placeholder="Enter Parent/Guardian Name" required>

            <label for="num">Phone Number:</label>
            <input type="number" name="" id="" placeholder="phone number"required>

            <label for="">Email Address:</label>
            <input type="email" name="" id="" placeholder="example@gmail.com">

            <label for="">Home Address:</label>
            <input type="textarea" placeholder="Enter your home address">

            <center> <button type="submit">Submit Your Application</button></center>
        </form>
